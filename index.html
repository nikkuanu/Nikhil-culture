<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikhilfx - Flipkart Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen pb-20">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-3 shadow-md sticky top-0 z-50">
    <div class="flex items-center justify-between max-w-7xl mx-auto">
      <h1 class="text-lg font-bold cursor-pointer" onclick="switchView('home')">Nikhilfx</h1>
      <div class="flex space-x-3 text-sm">
        <button onclick="switchView('orders')" class="hover:underline">My Orders</button>
      </div>
    </div>
    <!-- SEARCH BAR -->
    <div class="relative mt-2 max-w-7xl mx-auto">
      <input id="search-input" type="search" placeholder="Search for 10,000+ products, bags, dresses, prices (e.g. 1199)..." class="w-full bg-white text-gray-800 text-sm px-4 py-2 rounded-md focus:outline-none" autocomplete="off">
    </div>
  </header>

  <!-- SPINNER -->
  <div id="loading-spinner" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
    <div class="bg-white p-4 rounded-xl shadow-lg flex items-center space-x-3">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      <span class="text-gray-700 font-medium text-sm">Loading products...</span>
    </div>
  </div>

  <!-- VIEWS CONTAINER -->
  <div id="views-container" class="max-w-7xl mx-auto">

    <!-- HOME VIEW -->
    <div id="view-home" class="view-section">
      
      <!-- CATEGORIES SCROLL -->
      <div class="flex space-x-6 overflow-x-auto py-3 bg-white px-4 shadow-sm my-2 scrollbar-none">
        <button onclick="filterCategory('all')" class="text-sm font-medium whitespace-nowrap text-gray-700 hover:text-blue-600 focus:text-blue-600">All</button>
        <button onclick="filterCategory('top-offers')" class="text-sm font-medium whitespace-nowrap text-gray-700 hover:text-blue-600">⚡ Top Offers</button>
        <button onclick="filterCategory('electronics')" class="text-sm font-medium whitespace-nowrap text-gray-700 hover:text-blue-600">💻 Electronics & Laptops</button>
        <button onclick="filterCategory('fashion')" class="text-sm font-medium whitespace-nowrap text-gray-700 hover:text-blue-600">👗 Fashion & Bags</button>
      </div>

      <!-- BANNER WITH PROFILE PHOTO -->
      <div class="relative bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-6 m-4 rounded-xl shadow-md flex items-center justify-between overflow-hidden">
        <div>
          <h1 class="font-serif italic tracking-wide text-2xl font-bold bg-gradient-to-r from-amber-200 via-pink-400 to-indigo-200 bg-clip-text text-transparent drop-shadow-md">
            Welcome to Nikhil's World!
          </h1>
          <p class="text-sm text-blue-100 mt-1">Explore over 10,000+ items across bags, dresses, laptops & more!</p>
        </div>
        <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-white shadow-lg flex-shrink-0">
          <img src="1792164386199.png" alt="Nikhil" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- PRODUCTS GRID -->
      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- PRODUCT DETAIL VIEW -->
    <div id="view-detail" class="view-section hidden p-4">
      <button onclick="switchView('home')" class="mb-4 text-blue-600 font-medium text-sm flex items-center">&larr; Back to Products</button>
      <div id="detail-content" class="bg-white p-6 rounded-xl shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- ORDERS VIEW -->
    <div id="view-orders" class="view-section hidden p-4">
      <button onclick="switchView('home')" class="mb-4 text-blue-600 font-medium text-sm">&larr; Back to Home</button>
      <h2 class="text-xl font-bold mb-4 text-gray-800">My Order Tracking</h2>
      <div id="orders-list" class="space-y-4">
        <!-- Injected via JS -->
      </div>
    </div>

  </div>

  <!-- AI ASSISTANT FLOATING WIDGET -->
  <div class="fixed bottom-4 right-4 z-40">
    <button onclick="toggleAiChat()" class="bg-blue-600 text-white p-3 rounded-full shadow-lg flex items-center space-x-2 hover:bg-blue-700">
      <span class="text-xs font-bold">🤖 Nikhil AI</span>
    </button>
    <div id="ai-chat-box" class="hidden absolute bottom-14 right-0 w-80 bg-white rounded-xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col h-96">
      <div class="bg-blue-600 text-white p-3 flex justify-between items-center text-sm font-bold">
        <span>Nikhil AI Assistant</span>
        <button onclick="toggleAiChat()" class="text-white">&times;</button>
      </div>
      <div id="ai-messages" class="flex-1 p-3 overflow-y-auto space-y-2 text-sm bg-gray-50">
        <div class="bg-blue-100 text-blue-900 p-2 rounded-lg max-w-[80%]">Hi! Ask me to find any product (like "bag", "dress", "laptop") or price between ₹1000-₹1200!</div>
      </div>
      <div class="p-2 border-t flex">
        <input id="ai-input" type="text" placeholder="Ask AI..." class="flex-1 text-sm border px-2 py-1 rounded-l-md focus:outline-none">
        <button onclick="sendAiMessage()" class="bg-blue-600 text-white px-3 py-1 text-sm rounded-r-md">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Generate 10,000+ realistic products dynamically between ₹1000 and ₹1200
    const categoriesList = ['fashion', 'electronics', 'top-offers'];
    const baseNames = [
      "Classic Leather Backpack", "Waterproof Travel Laptop Bag", "Designer College Bag", 
      "Women's Floral Summer Dress", "Men's Casual Cotton Shirt", "Slim Fit Denim Jeans", 
      "Unisex Oversized Hoodie", "UltraPro Laptop Sleeve 15.6", "Wireless Bluetooth Earbuds", 
      "Smartwatch Fitness Tracker", "Mini Portable Projector", "Gaming Mechanical Keyboard",
      "Executive Office Handbag", "Party Wear Maxi Dress", "Traditional Kurta Set"
    ];
    
    const imagePool = [
      "https://images.unsplash.com/photo-1553062407-98eeb64c6a62",
      "https://images.unsplash.com/photo-1622560480605-d83c853bc5c3",
      "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf",
      "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1",
      "https://images.unsplash.com/photo-1542272604-787c3835535d",
      "https://images.unsplash.com/photo-1517336714731-489689fd1ca8",
      "https://images.unsplash.com/photo-1505740420928-5e560c06d30e",
      "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
    ];

    let products = [];
    for (let i = 1; i <= 10000; i++) {
      let randName = baseNames[(i - 1) % baseNames.length] + ` (Model #${i})`;
      let randCategory = categoriesList[(i - 1) % categoriesList.length];
      let randPrice = 1000 + (i % 201); // Generates prices strictly between 1000 and 1200
      let randImage = imagePool[(i - 1) % imagePool.length];
      
      products.push({
        id: i,
        name: randName,
        category: randCategory,
        price: randPrice,
        image: randImage,
        description: `High quality item crafted exclusively for Nikhilfx customers. Premium material with top-tier durability and sleek modern design.`
      });
    }

    let currentCategory = 'all';
    let orders = [
      { id: "ORD98231", product: "Classic Leather Backpack", price: 1199, status: "Out for Delivery", date: "Oct 18, 2026" }
    ];

    function showSpinner(callback) {
      const spinner = document.getElementById("loading-spinner");
      spinner.classList.remove("hidden");
      setTimeout(() => {
        spinner.classList.add("hidden");
        if (callback) callback();
      }, 300);
    }

    function switchView(viewId) {
      showSpinner(() => {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
        document.getElementById(`view-${viewId}`).classList.remove('hidden');
        window.scrollTo(0, 0);
        if(viewId === 'orders') renderOrders();
      });
    }

    function renderProducts(items) {
      const container = document.getElementById("product-grid");
      if (!container) return;

      if (items.length === 0) {
        container.innerHTML = `<div class="col-span-full py-16 text-center text-gray-500 font-medium">No results found</div>`;
        return;
      }

      // Render first 100 items for performance optimization while keeping full 10k searchable
      const displayItems = items.slice(0, 100);

      container.innerHTML = displayItems.map(p => `
        <div onclick="viewProductDetail(${p.id})" class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex flex-col justify-between cursor-pointer hover:shadow-md transition">
          <img src="${p.image}" class="h-40 w-full object-cover rounded-md mb-2">
          <h3 class="text-sm font-semibold text-gray-800 line-clamp-1">${p.name}</h3>
          <p class="text-green-600 font-bold mt-1">₹${p.price}</p>
          <span class="text-xs text-blue-500 mt-1 font-medium">View Details &rarr;</span>
        </div>
      `).join('');
    }

    function setupSearch() {
      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          const query = e.target.value.toLowerCase().trim();
          
          let baseList = currentCategory === 'all' 
            ? products 
            : products.filter(p => p.category === currentCategory);

          const results = baseList.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.price.toString().includes(query) ||
            p.category.toLowerCase().includes(query)
          );
          
          renderProducts(results);
        });
      }
    }

    function filterCategory(cat) {
      showSpinner(() => {
        currentCategory = cat;
        const searchInput = document.getElementById("search-input");
        const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

        let list = cat === 'all' ? products : products.filter(p => p.category === cat);

        if (query !== '') {
          list = list.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.price.toString().includes(query) ||
            p.category.toLowerCase().includes(query)
          );
        }

        renderProducts(list);
      });
    }

    function viewProductDetail(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      showSpinner(() => {
        const detailContainer = document.getElementById("detail-content");
        detailContainer.innerHTML = `
          <img src="${product.image}" class="w-full h-80 object-cover rounded-xl shadow-md">
          <div class="flex flex-col justify-between">
            <div>
              <span class="text-xs uppercase tracking-wider bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold">${product.category}</span>
              <h2 class="text-2xl font-bold text-gray-800 mt-2">${product.name}</h2>
              <p class="text-2xl font-bold text-green-600 mt-2">₹${product.price}</p>
              <p class="text-gray-600 text-sm mt-4">${product.description}</p>
            </div>
            <div class="mt-6 flex space-x-4">
              <button onclick="placeOrder('${product.name}', ${product.price})" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-lg font-bold shadow">Buy Now</button>
            </div>
          </div>
        `;
        switchView('detail');
      });
    }

    function placeOrder(productName, price) {
      orders.unshift({
        id: "ORD" + Math.floor(10000 + Math.random() * 90000),
        product: productName,
        price: price,
        status: "Order Placed / Processing",
        date: "Today"
      });
      alert("Order placed successfully! Redirecting to tracking.");
      switchView('orders');
    }

    function renderOrders() {
      const container = document.getElementById("orders-list");
      if(orders.length === 0) {
        container.innerHTML = `<p class="text-gray-500">No active orders found.</p>`;
        return;
      }
      container.innerHTML = orders.map(o => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
          <div>
            <span class="text-xs font-bold text-blue-600">${o.id}</span>
            <h4 class="font-bold text-gray-800 text-sm">${o.product}</h4>
            <p class="text-xs text-gray-500">Price: ₹${o.price} | Date: ${o.date}</p>
          </div>
          <div class="text-right">
            <span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-semibold">${o.status}</span>
          </div>
        </div>
      `).join('');
    }

    function toggleAiChat() {
      const box = document.getElementById("ai-chat-box");
      box.classList.toggle("hidden");
    }

    function sendAiMessage() {
      const input = document.getElementById("ai-input");
      const msgBox = document.getElementById("ai-messages");
      const text = input.value.trim();
      if(!text) return;

      msgBox.innerHTML += `<div class="bg-gray-200 text-gray-800 p-2 rounded-lg max-w-[80%] ml-auto text-right">${text}</div>`;
      input.value = "";

      setTimeout(() => {
        let reply = "I can help you find bags, dresses, laptops, or check items between ₹1000-₹1200. Try typing a keyword in the search bar!";
        const lower = text.toLowerCase();
        if(lower.includes("bag")) reply = "We have great backpacks and laptop bags priced between ₹1000 and ₹1200! Type 'bag' in the search bar.";
        else if(lower.includes("dress") || lower.includes("fashion")) reply = "Check out our top fashion and summer dress options under the Fashion category!";
        else if(lower.includes("laptop") || lower.includes("electronic")) reply = "We have sleeves, earbuds, and tech accessories priced between ₹1000-₹1200!";
        
        msgBox.innerHTML += `<div class="bg-blue-100 text-blue-900 p-2 rounded-lg max-w-[80%]">${reply}</div>`;
        msgBox.scrollTop = msgBox.scrollHeight;
      }, 500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderProducts(products);
      setupSearch();
    });
  </script>
</body>
</html>
